<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capstone Compass</title>
<meta name="description" content="Interactive guide for choosing, de-risking and planning a Google Cloud data engineering capstone, from a last-minute sprint to a four-month runway.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f1f5f6; --surface:#ffffff; --surface2:#f7fafb; --ink:#12222a; --muted:#4f6670; --line:#d5dfe3; --line2:#e6edf0;
  --accent:#0a6f82; --accent-ink:#ffffff; --accent-soft:#dff1f4; --focus:#0a6f82;
  --ok:#1b7a43; --okbg:#e2f4e8; --warn:#8a5300; --warnbg:#fff0d6; --bad:#b3261e; --badbg:#fde7e4;
  --gen-bg:#f8e3e5; --gen-fg:#8a3b45; --gen-fill:#e9b7bd;
  --ing-bg:#dcf3e6; --ing-fg:#1c6b45; --ing-fill:#5cb984;
  --tra-bg:#efdcf5; --tra-fg:#6b1f83; --tra-fill:#8e24aa;
  --srv-bg:#dbe9fb; --srv-fg:#1553a0; --srv-fill:#1565c0;
  --sto-bg:#e6e9ec; --sto-fg:#465560; --sto-fill:#d9dee2;
  --use-bg:#fbf3c1; --use-fg:#6a5a00; --use-fill:#fdf19a;
  --und-bg:#e9e4f7; --und-fg:#4b3d8a; --und-fill:#d9cff3;
  --code:#eaf0f2; --hero1:#dff1f4; --hero2:#f6efe4;
  --font-h:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --font-b:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --font-m:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c161b; --surface:#122029; --surface2:#16262f; --ink:#e3eef1; --muted:#9db3bc; --line:#26383f; --line2:#1d2e35;
  --accent:#55c4d8; --accent-ink:#06222a; --accent-soft:#12343d; --focus:#55c4d8;
  --ok:#6fd08c; --okbg:#153323; --warn:#f0b35a; --warnbg:#38290f; --bad:#ff8f88; --badbg:#3d1d1b;
  --gen-bg:#3b2226; --gen-fg:#f0b4bb; --ing-bg:#14342a; --ing-fg:#8fe0b4; --tra-bg:#33203d; --tra-fg:#dcaaf0;
  --srv-bg:#142c4a; --srv-fg:#9cc6f6; --sto-bg:#212d34; --sto-fg:#b4c4cc; --use-bg:#3a3410; --use-fg:#efe28a; --und-bg:#282444; --und-fg:#c4b9f2;
  --code:#182933; --hero1:#12343d; --hero2:#2a2416;}}
:root[data-theme="dark"]{
  --bg:#0c161b; --surface:#122029; --surface2:#16262f; --ink:#e3eef1; --muted:#9db3bc; --line:#26383f; --line2:#1d2e35;
  --accent:#55c4d8; --accent-ink:#06222a; --accent-soft:#12343d; --focus:#55c4d8;
  --ok:#6fd08c; --okbg:#153323; --warn:#f0b35a; --warnbg:#38290f; --bad:#ff8f88; --badbg:#3d1d1b;
  --gen-bg:#3b2226; --gen-fg:#f0b4bb; --ing-bg:#14342a; --ing-fg:#8fe0b4; --tra-bg:#33203d; --tra-fg:#dcaaf0;
  --srv-bg:#142c4a; --srv-fg:#9cc6f6; --sto-bg:#212d34; --sto-fg:#b4c4cc; --use-bg:#3a3410; --use-fg:#efe28a; --und-bg:#282444; --und-fg:#c4b9f2;
  --code:#182933; --hero1:#12343d; --hero2:#2a2416;}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--font-b);-webkit-font-smoothing:antialiased}
a{color:var(--accent)} a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
code,pre{font-family:var(--font-m);font-size:.84em}
code{background:var(--code);padding:.1em .38em;border-radius:5px}
pre{background:var(--code);padding:14px 16px;border-radius:10px;overflow:auto;border:1px solid var(--line2);line-height:1.5}
pre code{background:none;padding:0}
h1,h2,h3,h4{font-family:var(--font-h);line-height:1.15;letter-spacing:-.01em;text-wrap:balance;margin:1.4em 0 .5em}
h1{font-size:clamp(1.9rem,3.4vw,2.7rem);font-weight:800;margin-top:0} h2{font-size:1.55rem;font-weight:700} h3{font-size:1.15rem;font-weight:700} h4{font-size:1rem;font-weight:700}
p{margin:.55em 0;max-width:72ch} li{margin:.25em 0} ul,ol{padding-left:1.3em;margin:.4em 0}
.lead{font-size:1.15rem;color:var(--muted);max-width:68ch}
.muted{color:var(--muted)} .small{font-size:.875rem}
.eyebrow{font:700 .74rem/1 var(--font-b);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 .7rem}
/* ---- shell ---- */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
aside#side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:16px 14px 14px;display:flex;flex-direction:column;gap:11px;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 6px}
.brand svg{flex:none}
.brand b{font:800 1.28rem/1 var(--font-h);letter-spacing:-.02em;display:block} .brand span{font-size:.78rem;color:var(--muted);display:block;margin-top:3px}
#runpill{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:block;width:100%}
#runpill:hover{border-color:var(--accent)} #runpill small{display:block;color:var(--muted);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700} #runpill b{font-size:.95rem} #runpill span{display:block;font-size:.82rem;color:var(--muted)}
nav#nav{display:flex;flex-direction:column;gap:10px}
.ngroup h6{margin:0 8px 4px;font:700 .72rem/1 var(--font-b);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.ngroup h6 i{width:8px;height:8px;border-radius:2px;background:var(--gc,var(--accent));display:inline-block}
.ngroup button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:600 .93rem/1.2 var(--font-b);padding:5px 10px;border-radius:8px;cursor:pointer}
.ngroup button:hover{background:var(--accent-soft)} .ngroup button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.sidefoot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 6px} .sidefoot .iconbtn{white-space:nowrap;padding:5px 9px} #buildInfo{flex-basis:100%;font-size:.76rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:600 .85rem var(--font-b)}
.iconbtn:hover{border-color:var(--accent)}
.topbar{display:none}
main#main{padding:28px clamp(16px,3.4vw,44px) 90px;max-width:1180px;width:100%}
.panel{display:none} .panel.on{display:block}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line);padding:9px 14px;align-items:center;gap:10px}
  .topbar b{font:800 1.1rem var(--font-h);flex:1}
  aside#side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;transform:translateX(-102%);transition:transform .2s;box-shadow:10px 0 30px rgba(0,0,0,.25)}
  body.navopen aside#side{transform:none} body.navopen::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:28}
}
/* ---- surfaces ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card > h3:first-child,.card > h4:first-child{margin-top:0}
.plain{padding:0;border:0;background:none}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))} .g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))} .g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.callout{background:var(--accent-soft);border:1px solid transparent;border-radius:10px;padding:12px 16px;margin:16px 0;max-width:80ch}
.callout.warn{background:var(--warnbg)} .callout.bad{background:var(--badbg)} .callout.ok{background:var(--okbg)}
.callout b:first-child{letter-spacing:.01em}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)} tr:last-child td,tr:last-child th{border-bottom:0}
th{background:var(--surface2);font:700 .78rem/1.2 var(--font-b);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td:first-child{font-weight:600}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface2);border:1px solid var(--line);margin:1px 3px 1px 0;white-space:nowrap;color:var(--ink)}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent} .pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent} .pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.gen{background:var(--gen-bg);color:var(--gen-fg);border-color:transparent} .pill.ing{background:var(--ing-bg);color:var(--ing-fg);border-color:transparent} .pill.tra{background:var(--tra-bg);color:var(--tra-fg);border-color:transparent}
.pill.srv{background:var(--srv-bg);color:var(--srv-fg);border-color:transparent} .pill.sto{background:var(--sto-bg);color:var(--sto-fg);border-color:transparent} .pill.use{background:var(--use-bg);color:var(--use-fg);border-color:transparent} .pill.und{background:var(--und-bg);color:var(--und-fg);border-color:transparent}
.tag{font:600 .7rem/1 var(--font-m);border-radius:4px;padding:2px 5px;background:var(--code);color:var(--muted);vertical-align:1px;white-space:nowrap}
.tag.run{background:var(--okbg);color:var(--ok)} .tag.nr{background:var(--warnbg);color:var(--warn)}
.cite{font-size:.72rem;vertical-align:super;text-decoration:none;font-weight:700;padding:0 1px;color:var(--accent)} .cite:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer;font:600 .88rem var(--font-b)}
.chip:hover{border-color:var(--accent)} .chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:7px 16px;cursor:pointer;font:700 .92rem var(--font-b)}
.btn.ghost{background:none;color:var(--accent)} .btn:hover{filter:brightness(1.08)}
input[type=number],input[type=search],input[type=date],select{max-width:100%;font:inherit;font-size:.92rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0;background:var(--surface)} summary{cursor:pointer;font-weight:700}
.meter{display:inline-flex;gap:2px;vertical-align:middle} .meter i{width:12px;height:6px;border-radius:2px;background:var(--line);display:inline-block}
.meter i.f{background:var(--accent)} .meter.cost i.f{background:#d08a1a} .meter.risk i.f{background:var(--bad)}
/* ---- hero (start) ---- */
.hero{border-radius:16px;padding:clamp(20px,3.4vw,38px);background:linear-gradient(115deg,var(--hero1) 0%,var(--surface) 55%,var(--hero2) 100%);border:1px solid var(--line);position:relative;overflow:hidden}
.hero h1{max-width:20ch;margin-bottom:.35em}
.hero .lead{margin-bottom:1rem}
.flow{width:100%;max-width:640px;height:auto;display:block;margin:6px 0 0}
.flow .link{stroke:var(--muted);stroke-width:2;stroke-dasharray:5 6;fill:none;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:reduce){.flow .link{animation:none} html{scroll-behavior:auto} .idea{transition:none!important}}
.runway{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin:12px 0}
.rw{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.rw:hover{border-color:var(--accent)} .rw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.rw b{font:700 1.05rem var(--font-h);display:block} .rw span{display:block;font-size:.86rem;color:var(--muted)} .rw em{font-style:normal;font-weight:700;font-size:.8rem;color:var(--accent)}
.custom{display:flex;gap:14px;flex-wrap:wrap;align-items:end;font-size:.9rem}
.custom label{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-weight:600;font-size:.8rem}
.custom input{width:110px} .custom input[type=date]{width:158px}
/* ---- spectrum / matrix ---- */
.spec{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));min-width:820px}
.spec div{padding:10px 12px;border-right:1px solid var(--line2);font-size:.9rem;position:relative}
.spec div:last-child{border-right:0}
.spec div::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--ing-fill),var(--use-fill) 50%,var(--gen-fill));background-size:500% 100%;background-position:calc(var(--i) * 25%) 0}
.spec div:nth-child(1){--i:0}.spec div:nth-child(2){--i:1}.spec div:nth-child(3){--i:2}.spec div:nth-child(4){--i:3}.spec div:nth-child(5){--i:4}
.spec b{display:block;font:700 .72rem var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 3px}
.matrix{display:grid;grid-template-columns:150px repeat(3,minmax(180px,1fr));gap:8px;min-width:720px}
.matrix .h{font-weight:700;font-size:.9rem;padding:6px;align-self:center}
.matrix button.cell{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:12px;text-align:left;cursor:pointer;font:inherit}
.matrix button.cell:hover{border-color:var(--accent)} .matrix .lvl{font:700 .72rem var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* ---- idea cards ---- */
.idea{cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s;position:relative}
.idea:hover{transform:translateY(-2px);border-color:var(--accent)}
.idea h3{margin:0;font-size:1.05rem}
.idea .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.glyph{flex:none;display:grid;grid-template-columns:repeat(3,7px);gap:2px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.glyph i{width:7px;height:7px;border-radius:2px;background:var(--line);display:block} .glyph i.on{background:var(--accent)}
.idea .row{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;font-size:.8rem;color:var(--muted);align-items:center}
.star{border:none;background:none;cursor:pointer;font-size:1.15rem;color:var(--muted);padding:0 2px} .star.on{color:#e3a008}
.fit{font-size:.8rem;font-weight:700}
/* ---- drawer ---- */
#drawer{position:fixed;inset:0;z-index:60;display:none;background:rgba(6,16,20,.55)} #drawer.on{display:block}
#drawer .sheet{position:absolute;right:0;top:0;bottom:0;width:min(1000px,100%);background:var(--bg);overflow:auto;padding:20px clamp(14px,2.4vw,28px) 40px}
.sheet .bar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.subtabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0}
.subtabs button{border:none;background:none;color:var(--ink);padding:8px 12px;cursor:pointer;font:600 .92rem var(--font-b);border-bottom:3px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
.cons4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px;margin:10px 0}
.cons4>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.86rem}
.mm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;margin:10px 0}
.mm svg{max-width:100%;height:auto;min-width:560px}
/* ---- lifecycle svg ---- */
.lc{width:100%;max-width:880px;height:auto;display:block;margin:0 auto}
.lc g.node{cursor:pointer} .lc g.node:hover rect{stroke:var(--accent);stroke-width:3.5} .lc g.node.sel rect{stroke:var(--accent);stroke-width:4.5}
.lc text{fill:#10202a;font:700 14px var(--font-b);pointer-events:none} .lc .dk text{fill:#fff}
.lc rect{stroke:#22343d;stroke-width:1.4} .lc .frame{fill:none;stroke:var(--ink);stroke-width:5}
/* ---- misc widgets ---- */
.q{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.verdict{font-size:1.05rem;font-weight:700}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px} .kv dt{font-weight:700;color:var(--muted)} .kv dd{margin:0}
@media (max-width:640px){.kv{grid-template-columns:1fr}}
.beyond{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,470px),1fr));gap:12px;align-items:start}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.bcard h3{margin:0 0 4px;font-size:1.05rem} .bcard .meta{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.bcard .links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;counter-reset:s}
.steps>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.timeline{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.tl{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--line2)} .tl:last-child{border-bottom:0}
.tl .when{padding:12px 14px;background:var(--surface2);font-size:.86rem;color:var(--muted)} .tl .when b{display:block;color:var(--ink);font-size:.95rem}
.tl .what{padding:12px 16px} .tl .what ul{margin:.2em 0}
@media (max-width:640px){.tl{grid-template-columns:1fr}}
footer{padding:18px clamp(16px,3.4vw,44px) 40px;color:var(--muted);font-size:.85rem;max-width:1180px}
.hl{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---- orientation, designer, scaffolding ---- */
.searchbox{position:relative} .searchbox input{width:100%;padding:8px 10px;border-radius:9px;font-size:.92rem}
.sres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:50;max-height:60vh;overflow:auto;padding:4px}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:600 .9rem/1.3 var(--font-b);padding:7px 9px;border-radius:7px;cursor:pointer} .sres button small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.sres button:hover,.sres button.on{background:var(--accent-soft)}
#prog .progbtn{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 11px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
#prog .progbtn span{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700} #prog .progbtn b{font-size:.9rem}
#prog .progbtn i{grid-column:1/-1;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--ing-fill) var(--p),var(--line) var(--p))}
.sm{padding:4px 11px;font-size:.84rem}
.pillbtn{cursor:pointer;font-family:inherit} .pillbtn:hover{filter:brightness(.95);text-decoration:underline}
.helpstrip{display:flex;flex-wrap:wrap;gap:6px 26px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin:12px 0 4px;font-size:.9rem;max-width:80ch}
.nextbar{display:flex;align-items:center;gap:14px;margin-top:38px;padding-top:16px;border-top:1px solid var(--line)}
.journey{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}

const prepCredit = ()=>Math.min(Math.round(RUN.prep*2),20);
const capacity = ()=>RUN.cap+prepCredit();
const EFFORT = [6,10,16,24,36];
function fitOf(i){ const r=capacity()/EFFORT[i.time-1]; return r>=1.4?["roomy","ok"]:r>=1?["fits","ok"]:r>=0.7?["tight","warn"]:["stretch","bad"]; }

function phasePlan(){
  const total=Math.max(3,Math.round(RUN.prep*7));
  const usable = RUN.prep>=3 ? PHASES : PHASES.map(p=>p.k==="skill"?{...p,w:.04,min:0}:p);
  const sum=usable.reduce((a,p)=>a+p.w,0); let acc=0, prev=0; const out=[];
  usable.forEach((p,i)=>{ acc+=p.w; let end=Math.round(acc/sum*total); if(i===usable.length-1) end=total; if(end<=prev&&total>=usable.length) end=prev+1; if(end>total) end=total; const s0=prev,e=Math.max(end,s0); out.push({...p,s:s0,e}); prev=e; });
  return {phases:out,total};
}
/* relative labels: "Days 1 to 2 (week 1)" */
function whenLabel(p){ const d1=p.s+1, d2=Math.max(p.e,d1), w1=Math.floor(p.s/7)+1, w2=Math.floor((d2-1)/7)+1;
  return (d1===d2?`Day ${d1}`:`Days ${d1} to ${d2}`)+(RUN.prep>=1.5?` · ${w1===w2?`week ${w1}`:`weeks ${w1} to ${w2}`}`:""); }

function prepGantt(){

}

<h1>Eat the frog: buy certainty before you build</h1>
<p class="lead">"Eat the frog" means doing the hardest, riskiest task first. In a data project the frog is almost never the code. It is an assumption about the data: <i>can I get it, is it allowed, does it change, can I afford it, does it answer the question?</i></p>
<h2>1 · Turn worries into testable questions</h2>
<div class="tablewrap"><table>
<tr><th>Uncertainty</th><th>Cheap test (≤ 2 hours)</th><th>Pass looks like</th><th>If it fails, pivot to…</th></tr>
<tr><td><b>Access</b></td><td>Fetch a real sample with your real parameters; save the raw response</td><td>You have a file and can repeat the call</td><td>A bulk dump, another source, or a recorded replay</td></tr>
<tr><td><b>Terms / licence</b></td><td>Read the terms page; search for "store", "redistribute", "commercial"</td><td>Storing and showing derived data is allowed</td><td>Keep only aggregates, or choose a source with an open licence</td></tr>
<tr><td><b>Rate limits and quota</b></td><td>Look for rate-limit headers; make 20 polite calls; compute calls/day for your plan</td><td>Plan uses under ~50% of the quota</td><td>Slower cadence, fewer entities, batch endpoints</td></tr>
<tr><td><b>Freshness</b></td><td>Call 5 times with a delay; compare payload changes and cache headers</td><td>Data changes at least as often as you poll</td><td>Poll less often; drop the "real-time" claim</td></tr>
<tr><td><b>Volume and cost</b></td><td>Measure bytes/record and records/day; run a BigQuery dry run; compare to the free tier</td><td>Monthly storage and scans inside free tier or budget</td><td>Filter early, aggregate, partition, sample</td></tr>
<tr><td><b>Quality</b></td><td>Null rate per column, duplicate keys, time zones, units on 1,000 rows</td><td>Blocking problems are fixable in an afternoon</td><td>Narrow the scope to the clean subset</td></tr>
<tr><td><b>Joinability</b></td><td>Try the one join your story needs on the sample</td><td>Keys match ≥ 90%</td><td>Simplify the story to a single source</td></tr>
<tr><td><b>Your own skill</b></td><td>Build a 30-line "hello world" of the riskiest tool (Pub/Sub publish, protobuf decode, BigQuery ML)</td><td>It works, and you know why</td><td>Choose the tool you already practised</td></tr>
<tr><td><b>Demo-day reliability</b></td><td>Save 1 hour of raw data; replay it through your pipeline</td><td>The demo works with the network unplugged</td><td>Make replay mode the default demo</td></tr>
</table></div>
<h2>2 · The probe script</h2>
<p><code>probes/probe_api.py</code> (standard library only) answers most of the table in one command: status, latency, payload size and projected MB/day, rate-limit and cache headers, whether the payload changes between calls, robots.txt, JSON shape and null rates.</p>
<pre><code>python3 probes/probe_api.py "https://environment.data.gov.uk/flood-monitoring/id/floods" --n 3 --sleep 1</code></pre>
<p>What I got when I ran it <span class="tag">[RUN]</span>:</p>
<pre><code>latency (s)    : p50=2.04 max=3.02 over 3 calls (sleep 1.0s)
limit/cache hdr: {'Cache-Control': 'no-transform, max-age=300', ...}
changed between calls: 1/3 distinct payloads   -> cached: polling faster than 5 min is pointless
json shape     : {... "items": ["list[0]"]}    -> right now there are NO active floods: plan for empty data</code></pre>
<div class="callout"><b>Three lessons from running it.</b> (1) The Open-Meteo forecast payload differed on every call (3/3 distinct) only because it includes <code>generationtime_ms</code>: compare the data, not a raw hash. (2) The flood API is cached for 300 seconds, so a 1-minute poll returns the same data five times. (3) The Open-Meteo API host returned <code>Disallow: /</code> in robots.txt while documenting free API use (and CoinGecko disallowed some API paths): robots.txt is written for crawlers, so read the API <i>terms</i> instead, but do not ignore signals about acceptable use.</div>
<h2>3 · Measure a stream in 20 seconds</h2>
<pre><code>timeout 20 curl -sN https://stream.wikimedia.org/v2/stream/recentchange | grep -c '^data:'</code></pre>
<p><span class="tag">[RUN]</span> This printed 665 events, i.e. about 33 events per second, about 2.9 million per day if unfiltered. That single number decides whether you filter at the source, how big your Pub/Sub messages are against the 10 GiB monthly free tier, and whether Dataflow is even worth discussing.</p>
<h2>4 · Estimate BigQuery cost before running a query</h2>
<pre><code># [NOT RUN: needs your credentials]
bq query --dry_run --use_legacy_sql=false \\
 'SELECT station_id, COUNT(*) FROM \`my_project.mart.fct_trips\` WHERE trip_date BETWEEN "<start-date>" AND "<end-date>" GROUP BY 1'
# prints: "Query successfully validated. ... will process N bytes"
# Compare N with the free 1 TiB per month; partition filters shrink N.</code></pre>
<h2>5 · Start the data clock (free)</h2>
<p>ML and trend stories need <b>history</b>, and a source that only shows "now" gives you nothing you can build in one week. The earlier you start, the more history you have, so start collecting <i>today</i>: a tiny scheduled job that saves raw responses. Two weeks of history already beats most teams; with a four-month runway you can collect a real dataset (seasons, incidents, drift) that cannot be recreated afterwards.</p>
<pre><code># .github/workflows/collect.yml   [NOT RUN]  (use a dedicated small public repo, not your project repo)
name: collect
on:
  schedule: [{cron: "*/30 * * * *"}]   # GitHub may delay runs; it is not a precise clock
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          curl -s -A "student-collector/1.0" "https://api.carbonintensity.org.uk/intensity" >> data/raw.jsonl
          echo >> data/raw.jsonl
      - run: |
          git config user.name collector && git config user.email collector@users.noreply.github.com
          git add data && git commit -m "snapshot" && git push || true</code></pre>
<p class="small muted">Caveats: scheduled workflows can be delayed and, in public repositories, are disabled after a period without repository activity (check GitHub's current rules). Never put keys in the file; use repository secrets if a key is needed. Only collect sources whose terms allow storing the data.</p>
<h2>6 · Rules for throwaway spikes</h2>
<ul>
 <li><b>Time-box:</b> 2 hours per candidate source (a day for a complex one). When time is up, write pass, pivot or kill in the scorecard below.</li>
 <li><b>Throwaway means throwaway:</b> messy notebooks are fine. Do not polish, do not deploy.</li>
 <li><b>Everyone spikes something different</b> (a source each), then present in 5 minutes each.</li>
 <li><b>Record evidence:</b> paste the probe output. "It worked for me" is not evidence.</li>
</ul>
<p class="small muted">The first end-to-end run on your chosen source (the tracer bullet, v0) is on the Start page under <b>How it grows</b>.</p>`;

  const info={}; g.nodes.forEach(n=>{ const lines=wrap(n.label), sub=supSet.has(n.id)&&supNote[n.id]?wrap("("+supNote[n.id]+")"):[]; info[n.id]={lines,sub,h:(lines.length+sub.length)*LH+PY*2}; });
  const pos={}; let H=0;
  if(horiz){
    const colH=cols.map(c=>c.reduce((a,n)=>a+info[n.id].h,0)+GAP*(c.length-1)), Hm=Math.max(...colH,60);
    cols.forEach((c,k)=>{ let y=M+(Hm-colH[k])/2; const x=M+k*colW+(colW-nodeW)/2; c.forEach(n=>{ pos[n.id]={x,y,w:nodeW,h:info[n.id].h}; y+=info[n.id].h+GAP; }); });
    H=M+Hm+M;
  } else {
    const per=Math.max(1,Math.floor((W-2*M+GAP)/(nodeW+GAP))); let y=M;
    cols.forEach(c=>{ const rowsN=Math.ceil(c.length/per); for(let r=0;r<rowsN;r++){ const items=c.slice(r*per,(r+1)*per); const rowH=Math.max(...items.map(n=>info[n.id].h)); const tot=items.length*nodeW+(items.length-1)*GAP; let x=(W-tot)/2; items.forEach(n=>{ pos[n.id]={x,y,w:nodeW,h:info[n.id].h}; x+=nodeW+GAP; }); y+=rowH+34; } });
    H=y-34+M;
  }
  /* support band */
  if(support.length){ const tgt={}; dotted.forEach(e=>{ if(supSet.has(e.a)&&pos[e.b]&&tgt[e.a]===undefined) tgt[e.a]=pos[e.b].x+pos[e.b].w/2; });
    const sw=Math.min(nodeW+10,horiz?150:nodeW), order=[...support].sort((a,b)=>(tgt[a.id]??1e9)-(tgt[b.id]??1e9)); let y=H+30, x=M, rowH=0, rows=0;
    order.forEach(n=>{ const h=Math.max(info[n.id].h,0); let want=tgt[n.id]!==undefined?tgt[n.id]-sw/2:x; want=Math.max(x,want); if(want+sw>W-M){ y+=rowH+GAP; x=M; rowH=0; rows++; want=Math.max(M,Math.min(want,W-M-sw)); want=Math.max(x,tgt[n.id]!==undefined?Math.min(tgt[n.id]-sw/2,W-M-sw):x); }
      pos[n.id]={x:want,y,w:sw,h}; x=want+sw+GAP; rowH=Math.max(rowH,h); }); H=y+rowH+M; }
  const uid="ah"+(++__svgN); let edges="", nodes="", labels="";
  const anchor=(a,b)=>{ const A=pos[a],B=pos[b]; if(horiz&&!supSet.has(a)&&!supSet.has(b)&&B.x>A.x){ return {x1:A.x+A.w,y1:A.y+A.h/2,x2:B.x,y2:B.y+B.h/2,h:true}; } if(!horiz&&!supSet.has(a)&&!supSet.has(b)&&B.y>A.y){ return {x1:A.x+A.w/2,y1:A.y+A.h,x2:B.x+B.w/2,y2:B.y,h:false}; } const up=B.y<A.y; return {x1:A.x+A.w/2,y1:up?A.y:A.y+A.h,x2:B.x+B.w/2,y2:up?B.y+B.h:B.y,h:false}; };
  g.edges.forEach(e=>{ if(!pos[e.a]||!pos[e.b]) return; const q=anchor(e.a,e.b), dx=Math.max(20,Math.abs(q.x2-q.x1)/2), dy=Math.max(20,Math.abs(q.y2-q.y1)/2);
    const d=q.h?`M${q.x1},${q.y1} C${q.x1+dx},${q.y1} ${q.x2-dx},${q.y2} ${q.x2},${q.y2}`:`M${q.x1},${q.y1} C${q.x1},${q.y1+(q.y2>=q.y1?dy:-dy)} ${q.x2},${q.y2-(q.y2>=q.y1?dy:-dy)} ${q.x2},${q.y2}`;
    edges+=`<path d="${d}" fill="none" stroke="currentColor" stroke-width="${e.dotted?1.3:1.8}" ${e.dotted?'stroke-dasharray="4 4" opacity=".7"':""} marker-end="url(#${uid})"><title>${esc2(e.label||"")}</title></path>`; });
  g.nodes.forEach(n=>{ const p=pos[n.id], f=STAGE_FILL[n.stage]||STAGE_FILL.sto, i=info[n.id]; let ty=p.y+PY+LH*.78; let t=""; i.lines.forEach(l=>{ t+=`<text x="${p.x+p.w/2}" y="${ty}" text-anchor="middle" fill="${f[1]}" font-size="${FS}" font-weight="700">${esc2(l)}</text>`; ty+=LH; }); i.sub.forEach(l=>{ t+=`<text x="${p.x+p.w/2}" y="${ty}" text-anchor="middle" fill="${f[1]}" font-size="${FS-1.5}" font-style="italic" opacity=".8">${esc2(l)}</text>`; ty+=LH; });
    nodes+=`<g class="dn" data-id="${n.id}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8" fill="${f[0]}" stroke="#22343d" stroke-width="1.2" ${n.stage==="und"?'stroke-dasharray="4 3"':""}/>${t}</g>`; });
  return `<svg class="dsvg" data-ok="1" viewBox="0 0 ${W} ${Math.ceil(H)}" width="${W}" height="${Math.ceil(H)}" role="img" aria-label="Architecture diagram: ${esc2(g.nodes.map(n=>n.label).join(", "))}" style="color:var(--ink);font-family:var(--font-b);display:block;max-width:100%;height:auto"><defs><marker id="${uid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>${edges}${nodes}</svg>`;
}

let mermaidP=null, mid=0;
function loadMermaid(){
  if(mermaidP) return mermaidP;
  mermaidP = new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js";
    s.onload=()=>{try{mermaid.initialize({startOnLoad:false,securityLevel:"strict",theme:isDark()?"dark":"default",flowchart:{htmlLabels:true,curve:"basis"},gantt:{useWidth:1100}});res(mermaid)}catch(e){rej(e)}};
    s.onerror=()=>rej(new Error("mermaid script blocked or offline")); document.head.appendChild(s);
  });
  return mermaidP;
}
async function drawMermaid(node, code){
  node.dataset.code = code; node.classList.remove("err"); node.innerHTML='<span class="muted small">Rendering diagram…</span>';
  try{ const m=await loadMermaid(); const {svg}=await m.render("mm"+(++mid), code); node.innerHTML=svg; node.dataset.ok="1"; }
  catch(e){ node.classList.add("err"); node.dataset.ok="0"; node.innerHTML='<p class="small muted">The diagram could not be drawn (you may be offline, or a browser extension blocked the script). Source text:</p><pre></pre>'; $("pre",node).textContent=code; }
}
function mmBox(code){ const d=document.createElement("div"); d.className="mm"; d.setAttribute("role","img"); drawMermaid(d,code); return d; }
async function redrawAllMermaid(){ try{ if(window.mermaid) mermaid.initialize({startOnLoad:false,securityLevel:"strict",theme:isDark()?"dark":"default",flowchart:{htmlLabels:true,curve:"basis"}}); }catch(e){}
  for(const n of $$(".mm[data-code]")) await drawMermaid(n,n.dataset.code); }

/* recency is relative to the verification snapshot, so no calendar date is ever shown */
function recency(m){ if(m.archived) return "archived"; if(!m.pushed||!m.checked) return ""; const days=(new Date(m.checked)-new Date(m.pushed))/864e5; return days<=90?"recently active":days<=365?"updated within a year":"quiet for over a year"; }

  const ok=m.status>=200&&m.status<400, rc=recency(m); return `<span class="pill ${ok?"ok":m.status===403||m.status===429?"warn":"bad"}" title="status at the last verification">HTTP ${m.status}${m.stars!=null?` · ★${m.stars}`:""}${rc?` · ${rc}`:""}</span>`; }

RENDER.agents = el=>{
  el.innerHTML=`<p class="eyebrow">Learn</p><h1>Agents for data engineers</h1>
  <p class="lead">Google's own Architecture Center now includes agentic reference architectures for analytics ${cite("arch-xcloud","arch-lake")}, and the tooling to build them (ADK ${cite("adk")}, MCP Toolbox for Databases ${cite("toolbox")}, BigQuery conversational analytics ${cite("conv")}) is open and documented. <b>Nudge:</b> add one small, honest, evaluated agent to your project. The engineering is exactly what you already do: narrow tools, least privilege, tests, cost control.</p>
  <div class="callout"><b>What an agent is here.</b> A program in which a model chooses among tools you wrote (for example "run a read-only query on this dataset"), possibly over several steps. It is not magic and not a replacement for the pipeline: the pipeline must still work with the agent switched off.</div>
  <h2>The ladder</h2><div class="steps">
   <div><span class="pill ing">Rung 0 · no code</span><h3>Chat with a mart</h3><p class="small">Point BigQuery conversational analytics at your gold table. Write 10 questions with known answers and score it. The docs call it early-stage technology whose answers can be plausible but wrong, and charge it at BigQuery compute pricing ${cite("conv")}.</p></div>
   <div><span class="pill srv">Rung 1 · a few hours</span><h3>Tool-calling agent</h3><p class="small">An ADK agent using MCP Toolbox's prebuilt BigQuery tools (list tables, execute SQL). A codelab walks through it ${cite("toolbox-lab","bq-adk-blog")}.</p></div>
   <div><span class="pill tra">Rung 2 · a few days</span><h3>Your own tools, guardrails, evals</h3><p class="small">Define tools in <code>tools.yaml</code> or Python, enforce read-only access and byte caps, write a golden question set, and report accuracy and cost. Professional-services has an evaluation walkthrough for ADK agents ${cite("ps")}.</p></div>
   <div><span class="pill gen">Rung 3 · weeks</span><h3>Deploy and multi-agent</h3><p class="small">Deploy on Cloud Run with CI and Terraform from a template ${cite("starter")}; try a small multi-agent split (planner, SQL writer, reviewer) only if the single agent's errors justify it.</p></div></div>
  <h2>Seven agent patterns that fit data platforms</h2><div class="grid g2" id="pat"></div>
  <h2>Safety checklist</h2><div class="grid g2"><div class="card"><h3>From the ADK safety guidance ${cite("adk-safety")}</h3><ol>${AGENT_SAFETY_ADK.map(x=>`<li><b>${esc(x[0])}.</b> ${esc(x[1])}</li>`).join("")}</ol></div>
   <div class="card"><h3>Data-engineering additions (author's view)</h3><ul>${AGENT_SAFETY_DE.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>
  <h2>How to prove it works</h2>

RENDER.outcomes = el=>{ el.innerHTML=`<p class="eyebrow">Team</p>`+PAGES.outcomes+`<h2>Keep it alive after the bootcamp</h2><p>A project that keeps running is the strongest story you can tell. Add one thing a week.</p><div class="tablewrap"><table><tr><th>When</th><th>Add</th><th>What it says about you</th></tr>${KEEP_ALIVE.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="small">${esc(r[2])}</td></tr>`).join("")}</table></div><p class="small muted"><b>Keep the data clock running.</b> A collector that has run for three months is a dataset you cannot recreate in a week, and it lets you show real drift, seasonality and incident history.</p>`; $$("[data-jump]",el).forEach(b=>b.onclick=()=>{ showTab("start"); goSection(b.dataset.jump); }); };

/* ---------- cost ---------- */
RENDER.cost = el=>{
  el.innerHTML=`<p class="eyebrow">Build</p><h1>Google Cloud cost: what is free, what is not, how to stay safe</h1>
  <p class="lead">The free tier is generous for batch and polling projects, and stingy for anything that keeps a machine running all month. Numbers below were read from Google's free-features page at the last verification (see the footer) ${cite("gcp-free")}; check it again before you rely on it. A longer runway does not change the rule: keep a budget alert on and a teardown list.</p>
  <div class="grid g2"><div class="card"><h3>Free every month</h3><div class="tablewrap"><table>${FREE_TIER.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table></div></div>
  <div class="card"><h3>Not free, or easy to leave running</h3><ul>${NOT_FREE.map(r=>`<li><b>${esc(r[0])}.</b> ${esc(r[1])}</li>`).join("")}<li><b>Always-on consumers.</b> A 1-vCPU container running all month uses about 2.6 million vCPU-seconds against a free 180,000 (about 2 days) ${cite("gcp-free")} <span class="tag">computed</span>. Keep streaming demos short-lived, or replay recorded data.</li><li><b>LLM calls for agents.</b> Conversational analytics is charged at BigQuery compute pricing ${cite("conv")}; model tokens cost extra. Cap questions and keep the golden set small.</li></ul></div></div>
  <div class="callout warn"><b>Evidence from the course itself.</b> The Dask-on-Kubernetes challenge tells students to tear the cluster down "to avoid an unwanted bill" <span class="tag">READ</span> ${cite("course")}, and in an earlier review of the streaming module I noted that Dataflow's default workers run 24/7 until deleted <span class="tag">READ</span>.</div>
  <h2>Free-tier headroom calculator</h2><p class="small muted">Rough planning only. Assumes uncompressed payloads; real storage is often smaller after Parquet and BigQuery compression.</p>
  <div class="card"><div class="grid g4">
   <label class="small">Polls per hour<br><input id="cPph" type="number" min="0" value="12" style="width:100%"></label>
   <label class="small">KB per response<br><input id="cKb" type="number" min="0" value="40" style="width:100%"></label>
   <label class="small">Months of history kept<br><input id="cMo" type="number" min="1" value="${RUN.prep>=12?12:6}" style="width:100%"></label>
   <label class="small">Always-on container vCPU (0 if none)<br><input id="cCpu" type="number" min="0" step="0.25" value="0" style="width:100%"></label></div><div id="cOut" style="margin-top:12px"></div></div>
  <h2>Day zero: set up safely, once, together</h2>
  <div class="grid g2"><div class="card"><h3>Safe project set-up</h3><ol>
   <li>One project per team, billing linked, one region such as <code>europe-west1</code> for everything (bucket and dataset in the same region).</li>
   <li><b>Budget alerts</b> at low thresholds (for example 50%, 90%, 100% of a small budget). <b>Alerts notify; they do not stop spending</b>, so you still need a teardown habit.</li>
   <li>Enable only the APIs you need (BigQuery, Cloud Storage, Cloud Run, Pub/Sub, Cloud Scheduler, Secret Manager, Artifact Registry).</li>
   <li>One service account per component, least privilege (lesson: IaC · IAM and Security). Never share key files in chat.</li>
   <li>Label everything with <code>team</code> and <code>expires</code>; write the teardown steps in the README on day 1.</li>
   <li>Turn on the billing export to BigQuery now: it is not retroactive.</li></ol></div>
  <div class="card"><h3>Prove the platform end to end, then delete it</h3><ol>
   <li>Terraform a bucket and a BigQuery dataset (lesson: IaC · Storage).</li>
   <li>Upload a file and query it with SQL (lessons: Upload to GCS, Data Warehousing).</li>
   <li>Deploy a hello-world container to Cloud Run (lesson: Docker and deployment).</li>

   <li>Delete everything and confirm the bill stays flat. You now know the whole loop.</li></ol></div></div>

/* ===== APP 4: safe persistence (journey, My data, undo), project clock, pivot playbook ===== */
const KP="gcpguide:";
function allKeys(){ const ks=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(KP)) ks.push(k.slice(KP.length)); } }catch(e){} return ks; }
function snapshotAll(){ const o={}; allKeys().forEach(k=>{ if(k==="_undo") return; try{ o[k]=localStorage.getItem(KP+k); }catch(e){} }); return o; }
function restoreAll(o,replace=true){ try{ if(replace) allKeys().forEach(k=>{ if(k!=="_undo") localStorage.removeItem(KP+k); }); Object.entries(o).forEach(([k,v])=>{ if(k!=="_undo"&&v!=null) localStorage.setItem(KP+k,v); }); }catch(e){} }
function saveUndo(label){ try{ localStorage.setItem(KP+"_undo",JSON.stringify({label,data:snapshotAll()})); }catch(e){} }
function readUndo(){ try{ return JSON.parse(localStorage.getItem(KP+"_undo")||"null"); }catch(e){ return null; } }
function doUndo(){ const u=readUndo(); if(!u) return false; restoreAll(u.data); try{ localStorage.removeItem(KP+"_undo"); sessionStorage.setItem(KP+"toast","Restored: "+u.label); }catch(e){} location.reload(); return true; }
function reloadWithToast(msg){ try{ sessionStorage.setItem(KP+"toast",msg); }catch(e){} location.reload(); }

/* ---------- toast ---------- */
function toast(msg,undo){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button class="btn sm" id="toastUndo">Undo</button>':""}<button class="iconbtn sm" id="toastX" aria-label="Dismiss">✕</button>`; t.hidden=false;
  if(undo) $("#toastUndo",t).onclick=()=>{ t.hidden=true; undo(); }; $("#toastX",t).onclick=()=>{ t.hidden=true; };
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.hidden=true; },undo?15000:5000); }

/* ---------- project clock (the student's own start, kept in this browser; counts days, shows no calendar dates) ---------- */
const DAYMS=864e5;
function clockLoad(){ return Object.assign({mode:"draft",prepStart:null,projStart:null,nudge:0},store.get("clock",{})); }
function clockSave(c){ store.set("clock",c); }
function prepDayNow(c){ return c.prepStart?Math.floor((Date.now()-c.prepStart)/DAYMS)+1:null; }
function workdaysSince(ms){ let n=0; const d=new Date(ms); d.setHours(0,0,0,0); const end=new Date(); end.setHours(0,0,0,0); for(const t=new Date(d);t<=end;t.setDate(t.getDate()+1)){ const w=t.getDay(); if(w!==0&&w!==6) n++; } return Math.max(1,n); }
function projDayNow(c){ return c.projStart?Math.max(1,workdaysSince(c.projStart)+(c.nudge||0)):null; }
const projLenDays=()=>RUN.proj*5;
function pstageFor(day){ const r=day/projLenDays(); return PSTAGES.find(s=>r<=s.upto)||PSTAGES[PSTAGES.length-1]; }
function renderClock(host,onChange){
  const c=clockLoad(), pp=phasePlan(); const pd=prepDayNow(c), jd=projDayNow(c);
  const bar=(v,m)=>`<div class="pbar"><i style="width:${Math.min(100,v/m*100)}%"></i></div>`;
  let h=`<div class="clock"><div class="clockh"><b>Where are you in the plan?</b>`;
  if(c.mode==="draft") h+=`<span class="pill">Planning</span></div><p class="small">You are still planning, so nothing is locked and the timeline below is just a template. When you begin, start the clock: the guide will then count the days for you and tell you which phase and gate you are at, even when you open it again tomorrow. It stores <b>only your own start time, in this browser</b>, and shows day numbers, never dates.</p>
    <div class="dact"><button class="btn" id="ckPrep">Start preparing today</button><label class="small">…or I started <input id="ckAgo" type="number" min="0" max="200" value="0" style="width:70px"> days ago <button class="btn ghost sm" id="ckAgoGo">Set</button></label><button class="btn ghost" id="ckProj">Start the project today</button></div>`;
  else if(c.mode==="prep"){ const ph=pp.phases.find(p=>pd>p.s&&pd<=p.e), over=pd>pp.total; h+=`<span class="pill ing">Preparing</span></div><p style="font-size:1.05rem;margin:.2em 0"><b>Preparation day ${pd} of ${pp.total}</b>${ph?` · phase: <b>${esc(ph.n)}</b>`:""}</p>${bar(pd,pp.total)}${over?`<p class="small">You are past the planned preparation length. Start the project, or extend the plan by changing the runway (your ticks stay).</p>`:""}
    <div class="dact"><button class="btn" id="ckProj">Start the project today</button><button class="btn ghost sm" id="ckBack">Day −1</button><button class="btn ghost sm" id="ckFwd">Day +1</button><button class="btn ghost" id="ckStop">Back to planning</button></div>`; }
  else if(c.mode==="project"){ const L=projLenDays(), st=pstageFor(jd); h+=`<span class="pill srv">Building</span></div><p style="font-size:1.05rem;margin:.2em 0"><b>Project day ${jd} of ${L}</b> (working days) · <b>${esc(st.name)}</b></p>${bar(jd,L)}
    <ul class="small">${st.do.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <div class="dact"><button class="btn" data-go="pivot">Open the Pivot playbook</button><button class="btn ghost sm" id="ckBack">Day −1</button><button class="btn ghost sm" id="ckFwd">Day +1</button><button class="btn ghost" id="ckDone">Mark the project finished</button><button class="btn ghost" id="ckStop">Back to planning</button></div>
    <p class="small muted">Weekends are not counted. If you worked through one or took a break, nudge the day.</p>`; }
  else h+=`<span class="pill ok">Finished</span></div><p>The project is marked finished. See <button class="pill acc pillbtn" data-go="outcomes">Outcomes</button> for the interview story and how to keep it alive.</p><div class="dact"><button class="btn ghost" id="ckStop">Reopen the plan</button></div>`;
  h+=`<p class="small muted" style="margin-top:8px">Your ticks belong to phases, not dates, so changing the runway or the clock never loses them. Everything here lives only in this browser: use <b>My data</b> to back it up or move it to another computer.</p></div>`;
  host.innerHTML=h;
  const save=(m,x)=>{ saveUndo("clock change"); clockSave(Object.assign(clockLoad(),m)); if(onChange) onChange(); if(x) toast("Clock updated.",()=>doUndo()); };
  const on=(id,f)=>{ const b=$("#"+id,host); if(b) b.onclick=f; };
  on("ckPrep",()=>save({mode:"prep",prepStart:Date.now()},1)); on("ckAgoGo",()=>save({mode:"prep",prepStart:Date.now()-(+$("#ckAgo",host).value||0)*DAYMS},1));
  on("ckProj",()=>save({mode:"project",projStart:Date.now(),nudge:0},1)); on("ckStop",()=>{ if(confirm("Go back to planning? The clock stops. Your ticks, choices and plan are kept.")) save({mode:"draft"},1); });
  on("ckDone",()=>{ if(confirm("Mark the project finished?")) save({mode:"done"},1); });
  on("ckBack",()=>{ const c2=clockLoad(); if(c2.mode==="prep") save({prepStart:c2.prepStart+DAYMS}); else save({nudge:(c2.nudge||0)-1}); });
  on("ckFwd",()=>{ const c2=clockLoad(); if(c2.mode==="prep") save({prepStart:c2.prepStart-DAYMS}); else save({nudge:(c2.nudge||0)+1}); });
  $$("[data-go]",host).forEach(b=>b.onclick=()=>showTab(b.dataset.go));
}
/* editing the runway mid-plan asks first and keeps a snapshot for undo */
function guardRunway(apply){ const c=clockLoad(); if(c.mode==="prep"||c.mode==="project"){ if(!confirm("You are mid-plan. Changing the runway re-generates the timeline and the fit labels. Your ticks, shortlist, designs and clock are kept, and you can undo. Continue?")) return false; } saveUndo("runway change"); apply(); if(c.mode!=="draft") toast("Runway changed. Undo if that was a mistake.",()=>doUndo()); return true; }

/* ---------- My data: see, back up, restore and clear, item by item ---------- */
const DATA_ITEMS=[
 {id:"runway",n:"Runway",keys:["run","jn:runway"],sum:()=>`${RUNWAYS[RUN.profile]?RUNWAYS[RUN.profile].n:"Custom"}: ${RUN.prep} wk to prepare, ${RUN.proj} wk project, ${RUN.cap} person-days`},
 {id:"stars",n:"Shortlist",keys:["stars"],sum:()=>`${store.get("stars",[]).length} idea(s) starred`},
 {id:"score",n:"Feasibility scorecard",keys:["score"],sum:()=>`${Object.values(store.get("score",{})).reduce((a,b)=>a+ +b,0)} of 20 points`},
 {id:"designs",n:"Architecture designs",keys:["design","designs","jn:design"],sum:()=>`current design + ${store.get("designs",[]).length} saved`},
 {id:"plan",n:"Plan progress (ticks)",keys:["chk:plan"],sum:()=>`${Object.values(store.get("chk:plan",{})).filter(Boolean).length} item(s) ticked`},
 {id:"lists",n:"Other checklists",keys:["chk:proud","chk:cost","chk:port","pmr","score-notes"],sum:()=>`${["chk:proud","chk:cost","chk:port","pmr"].reduce((a,k)=>a+Object.values(store.get(k,{})).filter(Boolean).length,0)} item(s) ticked`},
 {id:"path",n:"Path answers",keys:["pathans","jn:path"],sum:()=>{ const a=store.get("pathans",null); return a?`${(PATHS[a.goal]||{}).n||a.goal}; ${EXPERIENCE[a.exp]?EXPERIENCE[a.exp][0]:""}`:"not chosen yet"; }},
 {id:"log",n:"Decision log",keys:["dlog"],sum:()=>`${store.get("dlog",[]).length} entr${store.get("dlog",[]).length===1?"y":"ies"}`},
 {id:"journey",n:"Journey ticks",keys:["journey","jn:spike"],sum:()=>`${JOURNEY.filter(journeyDone).length} of ${JOURNEY.length}`},
 {id:"clock",n:"Project clock",keys:["clock"],sum:()=>{ const c=clockLoad(); return c.mode==="draft"?"not started":c.mode==="prep"?`preparing, day ${prepDayNow(c)}`:c.mode==="project"?`project day ${projDayNow(c)}`:"finished"; }},
];
function exportBackup(){ const data=snapshotAll(); const blob=new Blob([JSON.stringify({app:"capstone-compass",version:1,data},null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="capstone-compass-backup.json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function importBackup(file){ const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); if(j.app!=="capstone-compass"||!j.data) throw new Error("not a Capstone Compass backup"); if(!confirm("Restore this backup? It replaces your current settings in this browser. A safety copy of what you have now is kept so you can undo.")) return; saveUndo("before restoring a backup"); restoreAll(j.data,true); reloadWithToast("Backup restored. You can undo this."); }catch(e){ alert("Could not read that file: "+e.message); } }; r.readAsText(file); }
function openMyData(){
  const m=$("#mydata"); m.hidden=false; document.body.style.overflow="hidden"; const u=readUndo();
  m.innerHTML=`<div class="sheet2" role="dialog" aria-label="My data"><div class="bar"><h2 style="margin:0">My data</h2><button class="iconbtn" id="mdClose" aria-label="Close">✕</button></div>
   <p class="small muted">Everything you choose in this guide is saved <b>only in this browser, on this computer, for this file</b>. There is no account and no server. Teammates each have their own copy. Clearing your browser data erases it, so back it up now and then.</p>
   <div class="dact"><button class="btn" id="mdExport">Download a backup (.json)</button><label class="btn ghost" style="cursor:pointer">Restore a backup…<input type="file" id="mdImport" accept="application/json,.json" hidden></label>${u?`<button class="btn ghost" id="mdUndo">Undo: ${esc(u.label)}</button>`:""}</div>
   <div class="tablewrap" style="margin-top:10px"><table><tr><th>What</th><th>Saved right now</th><th></th></tr>${DATA_ITEMS.map(it=>`<tr><td>${it.n}</td><td class="small">${esc((()=>{try{return it.sum()}catch(e){return ""}})())}</td><td><button class="pill pillbtn" data-clear="${it.id}">Clear…</button></td></tr>`).join("")}</table></div>
   <p class="small muted">Clearing asks first and keeps a copy for undo. "Journey ticks" and "Project clock" clear only themselves.</p>
   <details><summary>Erase everything</summary><p class="small">Removes all saved settings in this browser (a safety copy is kept for undo). Type <code>ERASE</code> to enable the button.</p><input id="mdErase" placeholder="ERASE" style="width:120px"> <button class="btn ghost" id="mdEraseGo" disabled>Erase everything</button></details></div>`;
  $("#mdClose").onclick=closeMyData; m.onclick=e=>{ if(e.target===m) closeMyData(); };
  $("#mdExport").onclick=exportBackup; $("#mdImport").onchange=e=>{ if(e.target.files[0]) importBackup(e.target.files[0]); };
  if($("#mdUndo")) $("#mdUndo").onclick=doUndo;
  $$("[data-clear]",m).forEach(b=>b.onclick=()=>{ const it=DATA_ITEMS.find(x=>x.id===b.dataset.clear); if(b.dataset.armed){ saveUndo("cleared "+it.n.toLowerCase()); it.keys.forEach(k=>{ try{ localStorage.removeItem(KP+k); }catch(e){} }); reloadWithToast("Cleared: "+it.n+". You can undo this."); } else { b.dataset.armed="1"; b.textContent="Yes, clear "+it.n.toLowerCase(); b.classList.add("bad"); setTimeout(()=>{ if(b.isConnected){ b.dataset.armed=""; b.textContent="Clear…"; b.classList.remove("bad"); } },6000); } });
  $("#mdErase").oninput=e=>{ $("#mdEraseGo").disabled=e.target.value.trim()!=="ERASE"; };
  $("#mdEraseGo").onclick=()=>{ saveUndo("erased everything"); allKeys().forEach(k=>{ if(k!=="_undo") try{ localStorage.removeItem(KP+k); }catch(e){} }); reloadWithToast("Everything erased. You can undo this."); };
}
function closeMyData(){ const m=$("#mydata"); m.hidden=true; m.innerHTML=""; document.body.style.overflow=""; }

/* ---------- pivot playbook ---------- */
RENDER.pivot = el=>{
  const c=clockLoad(); const manual=store.get("pstage","early"); const auto=c.mode==="project"; const stage=auto?pstageFor(projDayNow(c)):(PSTAGES.find(s=>s.id===manual)||PSTAGES[0]);
  const hs=store.get("hc",{}); const myid=store.get("myidea",(DES&&DES.idea)||(store.get("stars",[])[0])||IDEAS[0].id);
  el.innerHTML=`<p class="eyebrow">Build</p><h1>Pivot playbook</h1>
  <p class="lead">Plans meet reality. This page is for the moment they disagree: find out where you are, check the project's health, pick the smallest pivot that fixes it, and write it down. A pivot is a normal engineering decision, not a failure.</p>
  <h2>1 · Where are you?</h2><div class="card" id="pwhere"></div>
  <h2>2 · Health check (30 seconds)</h2><p class="small muted">Tick what is true right now. Your answers are saved.</p><div class="card" id="phc"></div>
  <h2>3 · Pivot menu</h2><p class="small muted">Pick the row that matches your symptom. "Try in the designer" applies the change to your current architecture so you can see what it removes.</p><div class="tablewrap"><table id="pmenu"></table></div>
  <h2>4 · What to cut, in order</h2><div id="pcut"></div>
  <h2>5 · Your idea's own pivot</h2><div class="card" id="pidea"></div>
  <h2>6 · Decision log</h2><p class="small muted">Write each pivot down in one minute. It becomes the honest "what I would do next" section of your README.</p><div class="card" id="plog"></div>
  <details><summary>The same thinking as a flowchart</summary><div id="ptree"></div></details>`;
  /* 1 where */
  const pw=$("#pwhere",el);
  pw.innerHTML=auto?`<p><span class="pill srv">Project day ${projDayNow(c)} of ${projLenDays()}</span> <b>${esc(stage.name)}</b></p><ul>${stage.do.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="small"><b>If you are behind, cut first:</b> ${esc(stage.cut)}</p><p class="small muted">Counted from the day you started the project clock on the Plan page.</p>`
   :`<p class="small muted">The project clock is not running, so choose where you are. (Start the clock on the <a href="#plan" data-go="plan">Plan page</a> and this fills itself in.)</p><div class="chips" id="pst">${PSTAGES.filter(s=>s.id!=="over").map(s=>`<button class="chip" data-st="${s.id}" aria-pressed="${s.id===manual}">${esc(s.name.split(":")[0])}</button>`).join("")}</div><div id="pstd"></div>`;
  const drawSt=()=>{ const s=PSTAGES.find(x=>x.id===store.get("pstage","early"))||PSTAGES[0]; const d=$("#pstd",el); if(d) d.innerHTML=`<p><b>${esc(s.name)}</b></p><ul>${s.do.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="small"><b>If you are behind, cut first:</b> ${esc(s.cut)}</p>`; };
  if(!auto){ drawSt(); $$("#pst button",el).forEach(b=>b.onclick=()=>{ store.set("pstage",b.dataset.st); $$("#pst button",el).forEach(x=>x.setAttribute("aria-pressed",x===b)); drawSt(); }); }
  $$("[data-go]",pw).forEach(a=>a.onclick=e=>{e.preventDefault();showTab(a.dataset.go)});
  /* 2 health */
  const hcx=$("#phc",el);
  const drawHc=()=>{ const yes=HEALTH.filter((h,i)=>hs[i]).length, no=HEALTH.map((h,i)=>({h,i})).filter(x=>!hs[x.i]); const lvl=yes>=6?["ok","Healthy"]:yes>=4?["warn","Needs attention"]:["bad","At risk"];
    hcx.innerHTML=`<div class="hc">${HEALTH.map((h,i)=>`<label><input type="checkbox" data-h="${i}" ${hs[i]?"checked":""}><span>${esc(h.q)}</span></label>`).join("")}</div>${yes===0?'<div class="callout"><span class="verdict">Tick what is true right now to see how healthy the project is.</span></div>':`<div class="callout ${lvl[0]}"><span class="verdict">${yes} of ${HEALTH.length} · ${lvl[1]}</span></div>`}${yes===0?"":no.length?`<h4>Fix in this order</h4><ol>${no.map(x=>`<li>${esc(x.h.no)}${x.h.pv.length?` <span class="muted small">Try: ${x.h.pv.map(p=>{const q=PIVOTS.find(z=>z.id===p);return q?`<button class="pill pillbtn" data-tp="${p}">${esc(q.label)}</button>`:"";}).join(" ")}</span>`:""}</li>`).join("")}</ol>`:'<p class="small">Nothing to fix. Keep the demo-able rule and add one thing at a time.</p>'}`;
    $$("[data-h]",hcx).forEach(cb=>cb.onchange=()=>{ hs[cb.dataset.h]=cb.checked; store.set("hc",hs); drawHc(); });
    $$("[data-tp]",hcx).forEach(b=>b.onclick=()=>tryPivot(b.dataset.tp)); };
  drawHc();
  /* 3 menu */
  $("#pmenu",el).innerHTML=`<tr><th>If…</th><th>Pivot to…</th><th>You keep</th><th></th></tr>`+PIVOT_MENU.map(r=>`<tr><td>${esc(r.sym)}</td><td>${esc(r.to)}</td><td class="small">${esc(r.keep)}</td><td>${r.pv.map(p=>{const q=PIVOTS.find(z=>z.id===p);return q?`<button class="pill acc pillbtn" data-tp="${p}" title="${esc(q.label)}">Try in the designer</button>`:"";}).slice(0,1).join("")}</td></tr>`).join("");
  $$("#pmenu [data-tp]",el).forEach(b=>b.onclick=()=>tryPivot(b.dataset.tp));
  /* 4 cut order */
  $("#pcut",el).innerHTML=`<div class="cutrow"><div class="cutcol"><h4>Cut in this order</h4><ol class="chiplist">${CUT_ORDER.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div><div class="cutcol never"><h4>Never cut</h4><ul class="chiplist">${NEVER_CUT.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>`;
  /* 5 idea */
  const pi=$("#pidea",el);
  const drawIdea=()=>{ const id=store.get("myidea",myid); const i=byId(id)||IDEAS[0]; pi.innerHTML=`<label class="small">Your idea <select id="pisel">${IDEAS.map(x=>`<option value="${x.id}" ${x.id===i.id?"selected":""}>${esc(x.title)}${store.get("stars",[]).includes(x.id)?" ★":""}</option>`).join("")}</select></label>
    <div class="grid g2" style="margin-top:8px"><div><h4>Cut first (stretch goals)</h4><ul>${i.stretch.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div><h4>Pivot down if stuck</h4><div class="callout warn" style="margin-top:0">${esc(i.pivot)}</div><p class="small muted">Its ladder: ${i.mvp.map(esc).join(" → ")}</p></div></div>
    <p class="small"><button class="pill acc pillbtn" id="pidsg">Open its architecture in the designer</button></p>`;
    $("#pisel",pi).onchange=e=>{ store.set("myidea",e.target.value); drawIdea(); }; $("#pidsg",pi).onclick=()=>designForIdea(i.id); };
  drawIdea();
  /* 6 log */
  const pl=$("#plog",el);
  const drawLog=()=>{ const L2=store.get("dlog",[]);
    pl.innerHTML=`<div class="grid g3"><label class="small">What changed<input id="lw" placeholder="e.g. streaming → recorded replay" style="width:100%"></label><label class="small">Why<input id="ly" placeholder="e.g. source blocked us twice" style="width:100%"></label><label class="small">What we keep<input id="lk" placeholder="e.g. Pub/Sub, dashboard, tests" style="width:100%"></label></div><div class="dact"><button class="btn" id="ladd">Add to the log</button>${L2.length?'<button class="btn ghost" id="lcopy">Copy as a README section</button>':""}</div>
     ${L2.length?`<div class="tablewrap" style="margin-top:8px"><table><tr><th>#</th><th>When</th><th>What changed</th><th>Why</th><th>We keep</th><th></th></tr>${L2.map((x,k)=>`<tr><td>${k+1}</td><td class="small">${esc(x.when||"")}</td><td>${esc(x.what)}</td><td class="small">${esc(x.why)}</td><td class="small">${esc(x.keep)}</td><td><button class="pill pillbtn" data-del="${k}">Delete</button></td></tr>`).join("")}</table></div>`:'<p class="small muted">No pivots logged yet. That is fine.</p>'}`;
    $("#ladd",pl).onclick=()=>{ const w=$("#lw",pl).value.trim(); if(!w) { $("#lw",pl).focus(); return; } const c2=clockLoad(); const when=c2.mode==="project"?`project day ${projDayNow(c2)}`:c2.mode==="prep"?`prep day ${prepDayNow(c2)}`:""; const L3=store.get("dlog",[]); L3.push({what:w,why:$("#ly",pl).value.trim(),keep:$("#lk",pl).value.trim(),when}); store.set("dlog",L3); drawLog(); };
    $$("[data-del]",pl).forEach(b=>b.onclick=()=>{ saveUndo("deleted a decision-log entry"); const L3=store.get("dlog",[]); L3.splice(+b.dataset.del,1); store.set("dlog",L3); drawLog(); toast("Entry deleted.",()=>doUndo()); });
    const cp=$("#lcopy",pl); if(cp) cp.onclick=e=>copyText("## Pivots and decisions\\n\\n"+L2.map((x,k)=>`${k+1}. **${x.what}**${x.when?` (${x.when})`:""}. Why: ${x.why||"n/a"}. Kept: ${x.keep||"n/a"}.`).join("\\n")+"\\n",e.target); };
  drawLog();
  const t6=TREES.find(t=>t.id==="pivot"); $("#ptree",el).appendChild(mmBox(t6.code));
};
/* apply a pivot to the current design and open the designer so the change is visible */
function tryPivot(id){ const p=PIVOTS.find(x=>x.id===id); if(!p) return; let ok=false; try{ ok=p.when(DES.sel); }catch(e){}
  if(!ok){ toast(`"${p.label}" does not apply to your current design. Open the designer, start from your idea, then use Simplify.`); built.designer=false; showTab("designer"); return; }
  const prev=clone(DES); DES.sel=p.apply(DES.sel); DES.lab=Object.assign({},DES.lab); ["ing","src","cad","tr","st","ml","sv","raw"].forEach(k=>delete DES.lab[k]); DES.name=(DES.name||"My design")+" (simplified)"; saveDes(); jset("design"); built.designer=false; showTab("designer");
  toast(`Applied: ${p.label}. Undo if it removes too much.`,()=>{ DES=prev; saveDes(); built.designer=false; showTab("designer"); }); }

</script>
